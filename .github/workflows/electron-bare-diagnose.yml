name: Diagnose bare Electron Windows startup

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/electron-bare-diagnose.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: e33-win2022-bare
            os: windows-2022
            electron: '33.4.11'
            gpuoff: 'no'
          - id: e33-win2022