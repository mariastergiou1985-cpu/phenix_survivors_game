name: Diagnose bare Electron Windows startup

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/electron-bare-diagnose.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: e33-win2022-bare
            os: windows-2022
            electron: '33.4.11'
            gpuoff: 'no'
          - id: e33-win2022-gpuoff
            os: windows-2022
            electron: '33.4.11'
            gpuoff: 'yes'
          - id: e33-win2025-bare
            os: windows-2025
            electron: '33.4.11'
            gpuoff: 'no'
          - id: e33-win2025-gpuoff
            os: windows-2025
            electron: '33.4.11'
            gpuoff: 'yes'
          - id: e43-win2025-bare
            os: windows-2025
            electron: '43.4.0'
            gpuoff: 'no'
          - id: e43-win2025-gpuoff
            os: windows-2025
            electron: '43.4.0'
            gpuoff: 'yes'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.id }}
    continue-on-error: true
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable WER LocalDumps
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'bare-dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumps -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Build minimal Electron app
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bare-electron'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'package.json') -Encoding utf8 -Value '{"name":"phenix-bare-electron-probe","version":"1.0.0","main":"main.cjs"}'
          @'
          const { app } = require('electron');
          const fs = require('fs');
          const trace = process.env.BARE_TRACE_FILE;
          function mark(stage, extra = {}) {
            try { fs.appendFileSync(trace, JSON.stringify({t:new Date().toISOString(), stage, ...extra}) + '\n'); } catch (_) {}
          }
          mark('main-loaded', { electron: process.versions.electron, chrome: process.versions.chrome, platform: process.platform });
          if (process.env.TEST_GPUOFF === '1') {
            mark('before-disable-hardware-acceleration');
            app.disableHardwareAcceleration();
            mark('after-disable-hardware-acceleration');
            app.commandLine.appendSwitch('disable-gpu');
            mark('after-disable-gpu-switch');
          }
          app.whenReady().then(() => {
            mark('app-ready');
            setTimeout(() => app.exit(0), 250);
          }).catch((e) => {
            mark('whenReady-rejected', { error: String(e) });
            app.exit(2);
          });
          setTimeout(() => {
            mark('timeout-20s');
            app.exit(3);
          }, 20000);
          '@ | Set-Content -Path (Join-Path $dir 'main.cjs') -Encoding utf8
          Push-Location $dir
          npm install --no-audit --no-fund --save-exact electron@${{ matrix.electron }}
          Pop-Location

      - name: Run bare startup probe
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'bare-electron'
          $trace = Join-Path $env:RUNNER_TEMP 'bare-trace.jsonl'
          Remove-Item $trace -Force -ErrorAction SilentlyContinue
          $env:BARE_TRACE_FILE = $trace
          $env:TEST_GPUOFF = if ('${{ matrix.gpuoff }}' -eq 'yes') { '1' } else { '0' }
          $exe = Join-Path $dir 'node_modules\electron\dist\electron.exe'
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.UseShellExecute = $false
          [void]$psi.ArgumentList.Add($dir)
          $p = [System.Diagnostics.Process]::Start($psi)
          $deadline = (Get-Date).AddSeconds(30)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (-not $p.HasExited) { $p.Kill($true); $p.WaitForExit() }
          $code = $p.ExitCode
          $hex = '0x{0:X8}' -f ($code -band 0xFFFFFFFF)
          $last = 'none'
          if (Test-Path $trace) {
            Get-Content $trace | ForEach-Object { Write-Host $_ }
            foreach ($line in Get-Content $trace) {
              try { $e = $line | ConvertFrom-Json; if ($e.stage) { $last = $e.stage } } catch {}
            }
          }
          $dumps = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'bare-dumps') -Filter '*.dmp' -ErrorAction SilentlyContinue)
          $result = if ($code -eq 0 -and $last -eq 'app-ready') { 'PASS' } else { 'CRASH_OR_FAIL' }
          $verdict = "${{ matrix.id }} | result=$result | exit=$code $hex | last-stage=$last | dumps=$($dumps.Count)"
          Write-Host "VERDICT:: $verdict"
          $out = Join-Path $env:RUNNER_TEMP 'bare-verdict'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $verdict | Out-File (Join-Path $out 'verdict.txt') -Encoding utf8
          exit 0

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bare-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/bare-trace.jsonl
            ${{ runner.temp }}/bare-dumps
            ${{ runner.temp }}/bare-verdict
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download verdicts
        uses: actions/download-artifact@v4
        with:
          path: all
          pattern: bare-*
      - name: Comparison
        shell: bash
        run: |
          {
            echo '## Bare Electron Windows startup isolation'
            echo
            echo '| variant | result | exit | last stage | dumps |'
            echo '|---|---|---|---|---|'
            for f in $(find all -name verdict.txt | sort); do
              tr -d '\r' < "$f" | awk -F' \\| ' '{printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5}' | sed 's/result=//; s/exit=//; s/last-stage=//; s/dumps=//'
            done
            echo
            echo 'Interpretation:'
            echo '- e33 bare fails on both Windows versions -> Electron 33 native startup issue'
            echo '- e33 Windows 2025 fails but Windows 2022 passes -> Windows 2025 interaction'
            echo '- bare passes but gpuoff fails -> disableHardwareAcceleration/disable-gpu path'
            echo '- e33 fails but e43 passes -> upgrade Electron candidate'
            echo '- all bare variants pass -> PHENIX shell/pre-ready configuration is the trigger, not base Electron'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
