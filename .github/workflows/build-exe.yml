# PHENIX: NULL EDEN - Windows .exe build (STANDALONE / OFFLINE - the Steam build)
name: Build Windows EXE

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'electron/**'
      - 'js/**'
      - 'assets/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the offline game payload
        run: node electron/prepare-game.js

      - name: Install packaging + runtime dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Build the installer + portable exe
        working-directory: electron
        run: npm run dist

      - name: Locate the built exe
        id: find
        shell: pwsh
        working-directory: electron
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter '*.exe' |
                 Where-Object { $_.FullName -match 'win-unpacked' } |
                 Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path dist -Recurse -Filter '*.exe' | Select-Object -First 1
          }
          if (-not $exe) { Write-Error 'no exe produced'; exit 1 }
          Write-Host "exe: $($exe.FullName)"
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Smoke-test the exe OFFLINE
        shell: pwsh
        run: |
          $exe = '${{ steps.find.outputs.exe }}'
          $resultFile = Join-Path $env:RUNNER_TEMP 'phenix-selftest.json'
          $traceFile = Join-Path $env:RUNNER_TEMP 'phenix-selftest-trace.jsonl'
          Remove-Item $resultFile,$traceFile -Force -ErrorAction SilentlyContinue
          $env:PHENIX_SELFTEST_RESULT_FILE = $resultFile
          $env:PHENIX_SELFTEST_TRACE_FILE = $traceFile

          Write-Host "self-testing $exe with every host resolving to NOTFOUND"

          # Start-Process -ArgumentList joins an array with spaces without preserving quoting.
          # Chromium then received the resolver rule as 3 argv entries. ProcessStartInfo.ArgumentList
          # performs the Windows quoting correctly and guarantees the resolver rule is one argument.
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.UseShellExecute = $false
          [void]$psi.ArgumentList.Add('--phenix-selftest')
          [void]$psi.ArgumentList.Add('--host-resolver-rules=MAP * ~NOTFOUND')
          $proc = [System.Diagnostics.Process]::Start($psi)
          if (-not $proc) { Write-Error 'failed to start packaged exe'; exit 1 }

          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $resultFile)) {
            if ($proc.HasExited) {
              $hex = '0x{0:X8}' -f ($proc.ExitCode -band 0xFFFFFFFF)
              Write-Host "selftest process exited early with code $($proc.ExitCode) ($hex)"
              break
            }
            Start-Sleep -Milliseconds 500
          }

          if (Test-Path $traceFile) {
            Write-Host '--- PHENIX SELFTEST TRACE ---'
            Get-Content $traceFile | ForEach-Object { Write-Host $_ }
            Write-Host '--- END TRACE ---'

            # Prove the packaged EXE itself received the resolver switch as ONE argv entry.
            $mainLoaded = $null
            foreach ($line in Get-Content $traceFile) {
              try {
                $entry = $line | ConvertFrom-Json
                if ($entry.stage -eq 'main-loaded') { $mainLoaded = $entry; break }
              } catch {}
            }
            if (-not $mainLoaded) {
              Write-Error 'ARGUMENT QUOTING UNVERIFIED: main-loaded trace entry missing'
              exit 1
            }
            $seen = @($mainLoaded.argv)
            $rule = @($seen | Where-Object { $_ -like '--host-resolver-rules=*' })
            $fragments = @($seen | Where-Object { $_ -eq '*' -or $_ -eq '~NOTFOUND' })
            if ($rule.Count -ne 1 -or $rule[0] -ne '--host-resolver-rules=MAP * ~NOTFOUND' -or $fragments.Count -ne 0) {
              Write-Error "ARGUMENT QUOTING BROKEN: argv=$($seen | ConvertTo-Json -Compress)"
              exit 1
            }
            Write-Host 'ARGUMENT_QUOTING::PASS'
          } else {
            Write-Host 'PHENIX selftest trace file was never created'
          }

          if (-not (Test-Path $resultFile)) {
            if (-not $proc.HasExited) { $proc.Kill($true); $proc.WaitForExit() }
            $exitInfo = if ($proc.HasExited) {
              $hex = '0x{0:X8}' -f ($proc.ExitCode -band 0xFFFFFFFF)
              "$($proc.ExitCode) ($hex)"
            } else { 'still-running' }
            Write-Error "selftest did not produce a result file; process=$exitInfo"
            exit 1
          }

          $raw = Get-Content $resultFile -Raw
          Write-Host "PHENIX_SELFTEST_FILE::$raw"
          try { $result = $raw | ConvertFrom-Json } catch {
            Write-Error 'selftest result file is not valid JSON'
            exit 1
          }
          if ($result.result -ne 'PASS') {
            Write-Error "the packaged exe did not boot offline: $raw"
            exit 1
          }
          if (-not $proc.HasExited) { $proc.WaitForExit(10000) | Out-Null }
          Write-Host 'PHENIX_SELFTEST_RESULT::PASS'

      - name: Package the build folder
        shell: pwsh
        working-directory: electron
        run: |
          $dir = Get-ChildItem -Path dist -Directory | Where-Object { $_.Name -match 'win-unpacked' } | Select-Object -First 1
          if ($dir) { Compress-Archive -Path $dir.FullName -DestinationPath ../PHENIX-NULL-EDEN-win64.zip -Force }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PHENIX-NULL-EDEN-win64
          path: PHENIX-NULL-EDEN-win64.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PHENIX-NULL-EDEN-installer
          path: electron/dist/*.exe
          retention-days: 30
