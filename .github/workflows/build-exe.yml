# PHENIX: NULL EDEN - Windows .exe build (STANDALONE / OFFLINE - the Steam build)
#
# WHAT CHANGED AND WHY (2026-08-11). This workflow used to ignore electron/main.js entirely: it
# wrote its OWN app/main.js that pointed a BrowserWindow at the live GitHub Pages site and
# packaged that. The exe it produced was a window around a website - it needed internet on every
# launch, it shipped none of the game, and it could never be a Steam build. It now runs the repo's
# real offline package: prepare-game.js assembles electron/game/, and electron-builder packages
# electron/main.js + preload.js + game/** exactly as `npm run dist` does locally. The CI artifact
# and the local build are the same thing.
#
# The build is then SMOKE-TESTED: the produced exe is launched with --phenix-selftest and every
# hostname resolved to NOTFOUND. The packaged exe writes a machine-readable result file because a
# Windows GUI-subsystem process does not reliably expose stdout to PowerShell.
name: Build Windows EXE

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'electron/**'
      - 'js/**'
      - 'assets/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble the offline game payload
        run: node electron/prepare-game.js

      - name: Install packaging + runtime dependencies
        working-directory: electron
        run: npm install --no-audit --no-fund

      - name: Build the installer + portable exe
        working-directory: electron
        run: npm run dist

      - name: Locate the built exe
        id: find
        shell: pwsh
        working-directory: electron
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter '*.exe' |
                 Where-Object { $_.FullName -match 'win-unpacked' } |
                 Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path dist -Recurse -Filter '*.exe' | Select-Object -First 1
          }
          if (-not $exe) { Write-Error 'no exe produced'; exit 1 }
          Write-Host "exe: $($exe.FullName)"
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Smoke-test the exe OFFLINE
        shell: pwsh
        run: |
          $exe = '${{ steps.find.outputs.exe }}'
          $resultFile = Join-Path $env:RUNNER_TEMP 'phenix-selftest.json'
          Remove-Item $resultFile -Force -ErrorAction SilentlyContinue
          $env:PHENIX_SELFTEST_RESULT_FILE = $resultFile
          Write-Host "self-testing $exe with every host resolving to NOTFOUND"
          $proc = Start-Process -FilePath $exe -ArgumentList @('--phenix-selftest', '--host-resolver-rules=MAP * ~NOTFOUND') -PassThru

          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $resultFile)) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $resultFile)) {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Write-Error 'selftest timed out without producing a result file'
            exit 1
          }

          $raw = Get-Content $resultFile -Raw
          Write-Host "PHENIX_SELFTEST_FILE::$raw"
          try { $result = $raw | ConvertFrom-Json } catch {
            Write-Error 'selftest result file is not valid JSON'
            exit 1
          }
          if ($result.result -ne 'PASS') {
            Write-Error "the packaged exe did not boot offline: $raw"
            exit 1
          }
          if (-not $proc.HasExited) { $proc.WaitForExit(10000) | Out-Null }
          Write-Host 'PHENIX_SELFTEST_RESULT::PASS'

      - name: Package the build folder
        shell: pwsh
        working-directory: electron
        run: |
          $dir = Get-ChildItem -Path dist -Directory | Where-Object { $_.Name -match 'win-unpacked' } | Select-Object -First 1
          if ($dir) { Compress-Archive -Path $dir.FullName -DestinationPath ../PHENIX-NULL-EDEN-win64.zip -Force }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PHENIX-NULL-EDEN-win64
          path: PHENIX-NULL-EDEN-win64.zip
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PHENIX-NULL-EDEN-installer
          path: electron/dist/*.exe
          retention-days: 30
